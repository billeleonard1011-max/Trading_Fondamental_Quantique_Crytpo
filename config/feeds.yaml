# Flux d'actualité et requêtes GDELT.
#
# Champs d'un flux :
#   name   : nom lisible, repris tel quel dans le rapport
#   url    : adresse du flux RSS ou Atom
#   tags   : étiquettes thématiques, utilisées pour router l'information
#   weight : fiabilité relative de la source, de 0 à 1. Sert à trancher les
#            doublons dans dataio.news.dedupe et à pondérer une synthèse.
#
# Toutes ces adresses sont des flux publics que les éditeurs diffusent
# volontairement. Aucun contenu payant n'est récupéré : un flux ne donne que
# le titre et le chapeau, jamais l'article complet.
#
# ATTENTION — « public » ne veut pas dire « libre d'usage automatisé ».
# Vérification du 11 septembre 2026 : plusieurs éditeurs interdisent
# explicitement la collecte automatisée de leurs flux, y compris quand ceux-ci
# sont ouverts. Ont été écartés pour ce motif : FinancialJuice, OilPrice,
# Bloomberg, South China Morning Post, Seeking Alpha et Dow Jones (WSJ Markets,
# WSJ World News, MarketWatch) — voir la note en fin de fichier.
# Avant d'ajouter une source, lire ses conditions.
#
# Vérifier l'état des flux : python -m scripts.check_feeds

feeds:
  # --- Presse financière de référence ---------------------------------------
  - name: "Financial Times"
    url: "https://www.ft.com/rss/home"
    tags: [marches, macro, geopolitique]
    weight: 0.9

  - name: "Yahoo Finance"
    url: "https://finance.yahoo.com/news/rssindex"
    tags: [marches, actions]
    weight: 0.5

  - name: "CNBC Finance"
    url: "https://www.cnbc.com/id/10000664/device/rss/rss.html"
    tags: [marches, macro]
    weight: 0.6

  - name: "CNBC Technology"
    url: "https://www.cnbc.com/id/19854910/device/rss/rss.html"
    tags: [technologie, semiconducteurs]
    weight: 0.6

  # --- Banques centrales ----------------------------------------------------
  # Source primaire : ce que la Fed et la BCE publient elles-mêmes, avant
  # toute interprétation journalistique. Poids maximal.
  - name: "Federal Reserve - communiques"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    tags: [banque_centrale, macro, taux, or]
    weight: 1.0

  # Discours et auditions : la Fed publie ses interventions dans un flux
  # distinct de ses communiqués. Même source, même statut — œuvre du
  # gouvernement fédéral américain, domaine public. Alimente le dossier
  # « politique monétaire », dont c'est la matière première.
  - name: "Federal Reserve - discours et auditions"
    url: "https://www.federalreserve.gov/feeds/speeches.xml"
    tags: [macro, banque_centrale, geopolitique]
    weight: 1.0

  - name: "BCE - communiques"
    url: "https://www.ecb.europa.eu/rss/press.html"
    tags: [banque_centrale, macro, taux]
    weight: 1.0

  # --- Crypto ---------------------------------------------------------------
  - name: "CoinDesk"
    url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    tags: [crypto]
    weight: 0.7

  - name: "The Block"
    url: "https://www.theblock.co/rss.xml"
    tags: [crypto]
    weight: 0.7

  # --- Secteur quantique ----------------------------------------------------
  - name: "Phys.org - physique quantique"
    url: "https://phys.org/rss-feed/physics-news/quantum-physics/"
    tags: [quantique, recherche]
    weight: 0.6

  # Ce flux avait été diagnostiqué « mal formé » à tort. Il est servi derrière
  # Cloudflare, qui renvoie du Brotli même quand la requête n'annonce que gzip
  # et deflate ; sans le paquet brotli, requests rendait les octets compressés
  # et feedparser échouait. Le flux fonctionne, il donne dix entrées d'actualité
  # industrielle. Voir la note sur la compression dans dataio/news.py.
  - name: "Quantum Computing Report"
    url: "https://quantumcomputingreport.com/feed/"
    tags: [quantique, industrie]
    weight: 0.7

  # Actualité économique et industrielle du secteur : levées de fonds,
  # contrats, politiques publiques. Complète Phys.org, qui ne couvre que la
  # recherche académique et ne cite donc presque jamais de société cotée —
  # c'est ce qui laissait le fil quantique sans matière.
  # --- Aléas physiques à effet sur les matières premières --------------------
  #
  # Séismes de magnitude 4,5 et plus, flux Atom mis à jour en continu.
  # L'intention : un séisme majeur dans une région minière ou pétrolière
  # déplace l'offre avant toute couverture de presse.
  #
  # Statut juridique : « USGS-authored or produced data and information are
  # considered to be in the U.S. Public Domain » (page Copyrights and
  # Credits). Aucune restriction d'usage automatisé — c'est la source la plus
  # clairement libre de toute la liste.
  #
  # MESURÉ LE 11 SEPTEMBRE 2026 : ce flux ne produit aujourd'hui aucun item
  # retenu. Ses titres ont la forme « M 4.7 - 66 km WSW of Zhaotong, China » ;
  # le filtre de pertinence compare aux mots-clés des dossiers, qui sont des
  # noms d'acteurs et de thèmes, jamais des régions productrices. Le flux est
  # donc collecté et intégralement écarté.
  #
  # Le rendre utile demande une dimension géographique que le projet n'a pas :
  # un dossier « aléas physiques sur les matières premières » listant les
  # régions minières et pétrolières (Chili et Pérou pour le cuivre, Golfe
  # persique et golfe du Mexique pour le pétrole, Afrique du Sud et Nevada
  # pour l'or). Laissé en place parce qu'il ne coûte rien et ne pollue pas —
  # mais il ne rapporte rien non plus tant que ce dossier n'existe pas.
  - name: "USGS - seismes 4.5 et plus"
    url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom"
    tags: [or, energie, geopolitique]
    weight: 1.0

  - name: "The Quantum Insider"
    url: "https://thequantuminsider.com/feed/"
    tags: [quantique, industrie]
    weight: 0.7

# Requêtes GDELT. Aucune clé requise.
#
# Elles ne servent pas à lire des articles mais à mesurer un volume de
# couverture : gdelt_intensity compare les dernières 24 h à la moyenne des
# 30 derniers jours et alerte au-delà d'un facteur 2. C'est la différence
# entre constater une escalade et la supposer.
#
# Syntaxe : les expressions entre guillemets sont recherchées telles quelles,
# OR et AND combinent les termes, les parenthèses regroupent.
gdelt_queries:
  - name: "Conflits energetiques"
    query: '("oil supply" OR "energy crisis" OR "pipeline attack" OR "oil embargo" OR "strait of hormuz")'
    tags: [geopolitique, energie, or]

  - name: "Tensions semi-conducteurs"
    query: '("semiconductor export" OR "chip ban" OR "chip export controls" OR "taiwan semiconductor" OR "export restrictions china chips")'
    tags: [semiconducteurs, geopolitique, technologie]

  - name: "Industrie quantique"
    query: '("quantum computing" OR "quantum computer" OR "quantum supremacy" OR "quantum advantage" OR "qubit")'
    tags: [quantique, technologie]

  - name: "Regulation crypto"
    query: '("crypto regulation" OR "bitcoin etf" OR "sec crypto" OR "stablecoin regulation" OR "mica crypto")'
    tags: [crypto, regulation]

  - name: "Risque geopolitique or"
    query: '("central bank gold" OR "gold reserves" OR "safe haven demand" OR "de-dollarization")'
    tags: [or, geopolitique, banque_centrale]

# ---------------------------------------------------------------------------
# Sources retirées, et pourquoi — à ne pas rajouter sans nouvelle vérification
# ---------------------------------------------------------------------------
#
# Dow Jones — WSJ Markets, WSJ World News, MarketWatch Top Stories
# (feeds.content.dowjones.io), retirés le 11 septembre 2026.
#
# Leurs conditions d'utilisation nomment précisément ce que fait ce projet :
#   « you may not access or use the Content, including without limitation,
#     any Content made available through one of our RSS feeds, in any
#     commercial product or service, without our express written consent »
#   « you may not use articles […] to develop or operate an automated
#     trading system, or for text or data mining »
#
# C'est le motif qui avait déjà fait écarter FinancialJuice et ACLED. Les
# garder tout en refusant d'autres sources pour la même clause aurait été un
# deux poids deux mesures.
#
# Ce que le retrait coûte, mesuré sur une collecte réelle de 24 h le
# 11 septembre 2026 : 49 articles bruts sur 172, et 10 items pertinents sur 23
# — pétrole et Moyen-Orient, politique monétaire, Russie-Ukraine. C'est une
# perte réelle, assumée, et compensée en partie par l'élargissement de
# l'admission (config/univers_admission.yaml), qui fait entrer depuis les flux
# restants des articles jusque-là écartés.
