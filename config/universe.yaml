# Univers suivi par le système.
#
# Ce fichier décrit *quoi* observer. Il ne contient aucune règle de décision :
# celles-ci vivent uniquement dans core/strategy.py.

# --- Références de marché ---------------------------------------------------
# Servent de dénominateur à la force relative (core.indicators.relative_strength)
# et de toile de fond au régime macro.
benchmarks:
  - ticker: SPY
    libelle: "Actions américaines - S&P 500"
  - ticker: QQQ
    libelle: "Technologie - Nasdaq 100"
  - ticker: TLT
    libelle: "Obligations d'État longues (20 ans et plus)"
  - ticker: UUP
    libelle: "Dollar américain (indice pondéré)"
  - ticker: GLD
    libelle: "Or physique"
  - ticker: USO
    libelle: "Pétrole brut WTI"

# Référence par défaut pour le calcul de force relative.
benchmark_principal: SPY

# --- ETF sectoriels SPDR ----------------------------------------------------
# Les onze secteurs du GICS. La rotation entre défensifs et cycliques est l'un
# des signaux les plus lisibles du cycle économique.
secteurs:
  - ticker: XLB
    libelle: "Matériaux de base"
    nature: cyclique
  - ticker: XLC
    libelle: "Services de communication"
    nature: cyclique
  - ticker: XLE
    libelle: "Énergie"
    nature: cyclique
  - ticker: XLF
    libelle: "Finance"
    nature: cyclique
  - ticker: XLI
    libelle: "Industrie"
    nature: cyclique
  - ticker: XLK
    libelle: "Technologies de l'information"
    nature: cyclique
  - ticker: XLP
    libelle: "Consommation de base"
    nature: defensif
  - ticker: XLRE
    libelle: "Immobilier"
    nature: defensif
  - ticker: XLU
    libelle: "Services aux collectivités"
    nature: defensif
  - ticker: XLV
    libelle: "Santé"
    nature: defensif
  - ticker: XLY
    libelle: "Consommation discrétionnaire"
    nature: cyclique

# Regroupements prêts à l'emploi. Le ratio défensifs / cycliques monte quand
# le marché se met à l'abri : c'est un indicateur de risque avancé.
groupes:
  defensifs: [XLP, XLRE, XLU, XLV]
  cycliques: [XLB, XLC, XLE, XLF, XLI, XLK, XLY]

# --- Instrument principal ---------------------------------------------------
# L'or est le seul instrument effectivement tradé. Le reste du fichier sert
# à la veille et au contexte.
instrument_principal:
  nom: "Or au comptant"
  symbole_trading: XAUUSD      # symbole du courtier prop firm
  proxy_donnees: GLD           # ETF utilisé pour l'historique quotidien
  proxy_alternatif: "GC=F"     # contrat à terme COMEX, via yfinance
  devise: USD

# --- Valeurs du secteur quantique ------------------------------------------
# Watchlist réellement suivie par modules/quantum.
#
# « seuil_mouvement_pct » déclenche l'analyse d'un mouvement. Il est réglable
# par valeur : ces titres n'ont pas la même volatilité structurelle, et un
# seuil unique produirait soit du bruit sur les plus nerveux, soit des
# silences sur les plus calmes.
#
# « keywords » sert à la recherche d'actualité : le ticker seul ramène trop de
# faux positifs (RGTI, QBTS ne sont pas des mots), le nom seul en rate.
quantum_watchlist:
  - ticker: "RGTI"
    name: "Rigetti Computing"
    cik: "1838359"          # vérifié via sec.gov/files/company_tickers.json
    keywords: ["Rigetti", "Rigetti Computing"]
    seuil_mouvement_pct: 8.0
  - ticker: "QBTS"
    name: "D-Wave Quantum"
    cik: "1907982"
    keywords: ["D-Wave", "DWave", "D-Wave Quantum"]
    seuil_mouvement_pct: 8.0
  - ticker: "IONQ"
    name: "IonQ"
    cik: "1824920"
    keywords: ["IonQ"]
    seuil_mouvement_pct: 8.0

# Paramètres de modules/quantum.
quantum:
  # Indice de référence du secteur : panier équipondéré des valeurs de la
  # watchlist. Aucun ETF quantique pur n'existe, et emprunter un ETF
  # thématique large introduirait des titres qui ne sont pas du quantique.
  reference_secteur: "panier_watchlist"

  # Références macro, pour distinguer un mouvement sectoriel d'un choc de taux.
  reference_marche: "QQQ"       # Nasdaq 100
  serie_taux_reels: "DFII10"

  # Classification sectoriel / spécifique.
  # Il faut au moins deux autres valeurs allant dans le même sens avec au
  # moins 40 % de l'amplitude du titre déclencheur. Une seule ne suffirait
  # pas : deux titres peuvent bouger ensemble par coïncidence.
  min_valeurs_concordantes: 2
  ratio_amplitude_min: 0.40

  # Variation des taux réels, en points de pourcentage sur la journée, à
  # partir de laquelle on considère que le mouvement de taux est notable.
  seuil_variation_taux_pct: 0.03

  # Trésorerie : alerte quand le runway estimé passe sous ce nombre de
  # trimestres. Ces sociétés brûlent du cash et se refinancent par émission
  # d'actions : un runway court annonce une dilution, pas une faillite.
  seuil_runway_trimestres: 4.0

  # Corrélation entre valeurs sur 60 séances glissantes. Au-delà, les
  # positions se comportent comme une seule.
  fenetre_correlation_seances: 60
  seuil_correlation_elevee: 0.70

  # Détection de nouveaux entrants dans l'actualité du secteur.
  min_mentions_for_alert: 3
  fenetre_nouveaux_entrants_jours: 30

  # Acteurs déjà connus : leur mention n'est pas une nouveauté.
  incumbents:
    - "IonQ"
    - "Rigetti"
    - "D-Wave"
    - "IBM"
    - "Google"
    - "Microsoft"
    - "Amazon"
    - "Intel"
    - "Honeywell"
    - "Quantinuum"
    - "Pasqal"
    - "PsiQuantum"
    - "Xanadu"
    - "Atom Computing"
    - "Alice & Bob"
    - "Quandela"
    - "Nvidia"
    - "Infleqtion"
    - "QuEra"
    - "Oxford Ionics"

# --- Fil d'actualité quantique ---------------------------------------------
# Paramètres de modules/quantum/feed.py.
feed_quantique:
  # Étiquettes de config/feeds.yaml dont les flux alimentent le fil.
  tags_flux: ["quantique", "quantum"]

  # Fenêtre de collecte à chaque exécution. Le module est conçu pour tourner
  # toutes les quinze à trente minutes ; une fenêtre de 24 h laisse une marge
  # confortable en cas d'exécution manquée, la déduplication par l'historique
  # empêchant tout doublon.
  fenetre_heures: 24

  # Nombre maximal d'items expliqués par exécution. Au-delà, les items sont
  # publiés sans analyse : mieux vaut un fil complet dont une partie attend
  # son explication qu'un fil tronqué.
  max_analyses_par_execution: 8

  # Entités à ne jamais faire apparaître dans le fil.
  #
  # Pasqal sert d'exemple de calibration au style d'explication attendu, dans
  # la documentation de modules/quantum. Elle ne fait pas partie des positions
  # suivies : la voir surgir dans le fil laisserait croire qu'elle est suivie.
  # Retirer cette entrée le jour où le titre entre dans quantum_watchlist.
  exclusions:
    - "Pasqal"
    - "PSQL"

# Requête GDELT du secteur, utilisée par modules/quantum/industry.py.
quantum_industry_watch:
  name: "Industrie quantique - financements et contrats"
  # Syntaxe GDELT : les parenthèses ne sont admises qu'autour d'alternatives
  # OR. Parenthéser un AND fait répondre « Parentheses may only be used around
  # OR'd statements ». La juxtaposition vaut AND implicite.
  query: '"quantum computing" (funding OR contract OR investment OR DARPA OR grant)'

# --- Positions crypto -------------------------------------------------------
# Les identifiants sont ceux de CoinGecko, pas les symboles boursiers.
#
# CHAQUE IDENTIFIANT A ÉTÉ VÉRIFIÉ par un appel réel à /api/v3/coins/list le
# 7 septembre 2026, par symbole ET par nom. La vérification par symbole seul
# ne suffit pas : plusieurs jetons partagent le même symbole, et plusieurs
# projets sans rapport portent des noms voisins.
#
# Cas ASTER, celui qui piège : le catalogue contient « aster-2 » (Aster, le
# DEX de perpétuels), mais aussi « aster-inu », « aster-dog », « baby-aster »,
# les quatre jetons « astherus-* » — et « astar » (ASTR), un projet totalement
# différent malgré la ressemblance. L'identité de aster-2 a été confirmée sur
# /coins/aster-2 : site asterdex.com, catégorie « Perpetuals », issu de la
# fusion Astherus / APX Finance.
crypto_watchlist:
  - symbol: "BTC"
    coingecko_id: "bitcoin"
    position: true
  - symbol: "ETH"
    coingecko_id: "ethereum"
    position: true
  - symbol: "SOL"
    coingecko_id: "solana"
    position: true
  - symbol: "DOGE"
    coingecko_id: "dogecoin"
    position: true
  - symbol: "ASTER"
    coingecko_id: "aster-2"
    position: true
    note: "DEX de perpétuels (asterdex.com). Vérifié : ne pas confondre avec astar/ASTR, aster-inu ni astherus-*."
  - symbol: "KNTQ"
    coingecko_id: "kinetiq"
    position: true
    note: "Staking liquide sur Hyperliquid (kinetiq.xyz). Distinct de kinetic-staked-hype (kHYPE)."
  - symbol: "PONS"
    coingecko_id: "pons"
    position: true
    note: >-
      Token de launchpad memecoin sur Robinhood Chain, lancé mi-juillet 2026.
      Extrêmement jeune et volatil (variations de plusieurs centaines de % en
      quelques semaines) : les seuils d'alerte et les hypothèses de régime
      calibrés sur BTC/ETH n'ont aucun sens ici. Traité à part par
      modules/crypto/positioning.py.
    jeune_et_volatil: true
  - symbol: "JUP"
    coingecko_id: "jupiter-exchange-solana"
    position: true
    note: "Jupiter (Solana). Distinct de « jupiter » qui désigne Jupiter Project."
  - symbol: "TAO"
    coingecko_id: "bittensor"
    position: true
  - symbol: "LINK"
    coingecko_id: "chainlink"
    position: true

# Paramètres de modules/crypto.
# --- Déblocages de jetons ---------------------------------------------------
# Aucune source gratuite ne publie de calendrier de déblocage : DefiLlama
# réserve /emissions à son offre payante (HTTP 402) et CryptoRank exige une
# clé (401). Les échéances connues sont donc saisies ici, à la main, sur le
# modèle du calendrier FOMC : source officielle citée, révisable quand le
# projet republie un changement.
#
# « statut » prend l'une de ces cinq valeurs, et la distinction compte :
#   actif         : un calendrier existe et une échéance est connue
#   vesting_conclu: le calendrier est arrivé à son terme
#   non_applicable: le jeton n'a pas de mécanisme de vesting
#   inconnu       : aucune source identifiée — ce n'est pas « pas de déblocage »
#   absent        : jeton non renseigné ici
#
# « inconnu » et « non_applicable » ne doivent jamais être confondus : le
# premier est une ignorance, le second une propriété du jeton.
deblocages_tokens:
  ASTER:
    statut: actif
    source: "https://docs.asterdex.com/usdaster-token/tokenomics"
    verifie_le: "2026-09-08"
    prochain_deblocage_connu:
      date: "2027-09-17"
      jetons: 400000000
      part_offre_pct: 5.0
      description: >-
        400 millions de jetons, soit 5 % de l'offre. Le déblocage devait
        commencer le 17 septembre 2026 au rythme de 10 millions par mois ;
        le 1er septembre 2026, le projet l'a reporté d'un an, au 17 septembre
        2027.
    motif_si_change: >-
      Échéance reportée une fois déjà. Si la documentation du projet publie un
      nouveau calendrier, corriger cette entrée à la main : aucune collecte
      automatique ne la mettra à jour.

  JUP:
    statut: vesting_conclu
    source: "vote de gouvernance « Jupiter Goes Green » (2026)"
    verifie_le: "2026-09-08"
    description: >-
      Le calendrier de vesting s'est en grande partie achevé à la suite du
      vote de gouvernance. Il n'y a pas d'échéance à venir à surveiller, ce
      qui est une information en soi et non une absence de donnée.

  TAO:
    statut: non_applicable
    source: "conception du protocole : émission continue avec halving"
    verifie_le: "2026-09-08"
    description: >-
      Pas de mécanisme de vesting applicable : l'émission est continue, par
      halving à la manière du bitcoin, sans allocation verrouillée pour des
      investisseurs. Ce n'est pas un échec de collecte, c'est une propriété
      du jeton.

  KNTQ:
    statut: inconnu
    verifie_le: "2026-09-08"
    description: >-
      Aucune source de suivi de vesting identifiée. Probablement un lancement
      sans allocation verrouillée, mais non confirmé : l'absence d'échéance
      connue ne vaut pas absence de déblocage.

  PONS:
    statut: inconnu
    verifie_le: "2026-09-08"
    description: >-
      Aucune source de suivi de vesting identifiée. Probablement un lancement
      sans allocation verrouillée, mais non confirmé.

crypto_regime:
  # MVRV : rapport entre capitalisation de marché et capitalisation réalisée.
  # Source retenue : API Community de Coin Metrics, métrique CapMVRVCur,
  # gratuite et sans clé (vérifié le 7 septembre 2026 pour BTC et ETH).
  # Aucune estimation maison du prix réalisé n'est faite : le catalogue
  # gratuit n'expose pas CapRealUSD, mais expose le ratio directement.
  actifs: ["btc", "eth"]

  # Seuils de régime sur le MVRV. Ce sont des repères d'usage, pas des lois :
  # ils sont ici pour être révisés quand on aura mesuré leur tenue.
  seuils_mvrv:
    capitulation_max: 1.0     # sous 1, le détenteur moyen est en perte latente
    accumulation_max: 2.0
    expansion_max: 3.0        # au-delà, distribution

  # Croissance de l'offre de stablecoins sur 30 jours, en pourcentage.
  # Source : DefiLlama, /stablecoincharts/all, gratuit et sans clé.
  seuil_croissance_stablecoins_pct: 2.0
  fenetre_stablecoins_jours: 30

crypto_positioning:
  # Binance et Bybit exposent funding et open interest sans clé (vérifié).
  symbole_perp: "BTCUSDT"
  fenetre_percentile_funding_jours: 90
  # Funding au-delà de ce percentile : levier tendu d'un côté du marché.
  percentile_extreme_haut: 90.0
  percentile_extreme_bas: 10.0

# --- Séries macroéconomiques FRED ------------------------------------------
# Consultables sur https://fred.stlouisfed.org/series/<identifiant>
# Une clé gratuite est requise : variable d'environnement FRED_API_KEY.
fred_series:
  - id: DGS10
    libelle: "Taux souverain 10 ans"
  - id: DGS2
    libelle: "Taux souverain 2 ans"
  - id: T10Y2Y
    libelle: "Pente de la courbe 10 ans moins 2 ans"
  - id: DFII10
    libelle: "Taux réel 10 ans (TIPS)"
  - id: T10YIE
    libelle: "Inflation anticipée à 10 ans (point mort)"
  - id: BAMLH0A0HYM2
    libelle: "Prime de risque haut rendement"
  - id: DCOILWTICO
    libelle: "Pétrole brut WTI, prix au comptant"
  - id: DTWEXBGS
    libelle: "Dollar américain, indice large pondéré des échanges"
  - id: VIXCLS
    libelle: "Indice de volatilité VIX"
  - id: UNRATE
    libelle: "Taux de chômage"
  - id: CPIAUCSL
    libelle: "Indice des prix à la consommation"
  - id: WALCL
    libelle: "Bilan de la Réserve fédérale (millions de dollars)"
  - id: RRPONTSYD
    libelle: "Prises en pension au jour le jour (milliards de dollars)"

# Séries utilisées par dataio.macro.compute_macro_regime.
# Attention aux unités : WALCL est publié en millions, RRPONTSYD en milliards.
# La conversion est faite dans le code, pas ici.
regime_macro:
  courbe_des_taux: [T10Y2Y, DGS10, DGS2]
  stress_credit: [BAMLH0A0HYM2]
  liquidite_nette: [WALCL, RRPONTSYD]

# --- Paramètres de risque par défaut ---------------------------------------
# Repris par core.strategy.RiskConfig. Compte prop firm de 10 000 dollars.
# Ce sont des valeurs de départ, pas une recommandation.
risque:
  capital_initial: 10000
  devise: USD
  risk_per_trade_pct: 0.5
  max_positions: 3
  max_exposure_pct: 100.0
  max_daily_loss_pct: 3.0
  commission_pct: 0.02
  slippage_pct: 0.02
