# Vocabulaire d'ADMISSION des fils d'actualité — « est-ce que ça touche mon
# univers ? », et rien d'autre.
#
# Pourquoi ce fichier existe séparément des dossiers
# --------------------------------------------------
# Jusqu'ici, les mots-clés de config/geopolitique_dossiers.yaml jouaient deux
# rôles à la fois : décider si un article *entre* dans le fil, et décider dans
# quel *onglet* le ranger. Les deux questions n'ont pourtant pas la même
# réponse. « Dans quel dossier ranger cet article ? » doit être exigeant — un
# dossier nommé n'a de sens que si ce qu'il contient lui correspond vraiment.
# « Cet article me concerne-t-il ? » doit être large — ce qui m'intéresse
# dépasse de loin les sept dossiers nommés.
#
# Confondre les deux revient à jeter tout ce qui compte sans rentrer dans une
# case. Le cas mesuré : un séisme de magnitude 6 sous une région productrice de
# cuivre était collecté par le flux USGS, puis intégralement écarté, parce que
# son titre (« M 6.1 - 40 km W of Calama, Chile ») ne contient aucun mot-clé de
# dossier. L'information n'était pas jugée peu importante : elle n'était pas
# jugée du tout.
#
# Ce fichier ne porte donc QUE l'admission. Le rattachement reste aux dossiers
# (config/geopolitique_dossiers.yaml). Un article admis qui ne correspond à
# aucun dossier va dans « Autres », qui devient la destination normale de tout
# ce qui compte sans rentrer dans une case nommée, et non plus une exception.
#
# Le garde-fou contre le bruit n'est pas l'admission mais le CLASSEMENT
# ---------------------------------------------------------------------
# Chaque domaine déclare sa « portée » : à quelle distance il se trouve des
# actifs réellement suivis. Un article admis sans lien mesurable avec l'un
# d'eux est rangé plus bas, jamais écarté.
#
#   actif_direct  l'article nomme un actif détenu ou suivi directement :
#                 or et métaux précieux, informatique quantique, crypto-actifs.
#   influence     il nomme un canal de transmission connu vers ces actifs :
#                 pétrole, dollar, taux, inflation, banques centrales, actions
#                 et technologie, semi-conducteurs, matières premières, banques
#                 et crédit, croissance et emploi, cyberattaques, catastrophes
#                 naturelles, transition énergétique.
#   contexte      il relève de la géopolitique au sens large — conflits,
#                 sanctions, accords, élections, tensions commerciales — sans
#                 nommer d'actif ni de canal. Admis, rangé en dernier.
#
# Champs d'un domaine
# -------------------
#   id            identifiant stable.
#   libelle       nom affiché ; c'est lui qui paraît dans le fil, donc il doit
#                 dire au lecteur pourquoi l'article est là.
#   portee        actif_direct | influence | contexte (voir ci-dessus).
#   dossier       facultatif : identifiant d'un dossier de
#                 config/geopolitique_dossiers.yaml auquel rattacher l'article
#                 admis par ce domaine. C'est le seul point de contact entre
#                 les deux fichiers, et il va dans ce sens-là uniquement —
#                 l'admission peut nourrir un dossier, jamais l'inverse.
#   termes        vocabulaire ancré sur un DÉBUT de mot, comme partout dans le
#                 projet : « Iran » retrouve « Iranian », jamais « Tirana ».
#                 Un terme écrit entièrement en majuscules est lu comme un
#                 sigle et comparé au mot entier — « TIPS » ne doit pas se
#                 déclencher sur « tips for investors ». Un terme plus court
#                 que `longueur_min_terme` qui n'est pas un sigle est ignoré :
#                 c'est le sort de « or », dont les deux lettres se
#                 retrouveraient dans la conjonction anglaise « or ».
#   termes_exacts facultatif : termes toujours comparés au mot entier, quelle
#                 que soit leur longueur. Les noms de pays des régions
#                 productrices l'exigent — sans lui, « Mali » se déclencherait
#                 sur « Malibu » — et c'est aussi ce qui permet de rattraper
#                 l'or en français : « l'or » se normalise en « l or », dont
#                 l'ancrage au début du mot attraperait « l'ordre ».
#   exige_seisme  facultatif : true pour n'admettre que si le texte porte aussi
#                 une magnitude sismique au moins égale au seuil réglé plus
#                 bas. Réservé aux régions productrices : sans cette condition,
#                 « Chine » ferait entrer toute l'actualité chinoise dans le
#                 dossier matières premières.
#
# Les deux listes mêlent français et anglais. Les seize flux configurés et
# GDELT sont aujourd'hui tous anglophones ; les termes français sont gardés
# pour que l'ajout d'une source francophone n'oblige pas à rouvrir ce fichier.

reglages:
  longueur_min_terme: 4

  # Magnitude minimale d'un séisme pour qu'un événement localisé soit admis.
  #
  # 6.0 n'est pas un arrondi de confort : en dessous, les dégâts sur une mine
  # ou une infrastructure pétrolière ne sont pratiquement jamais rapportés, et
  # le flux USGS 4.5+ produit une vingtaine d'entrées par jour dont aucune ne
  # dit rien d'une production. Au-dessus, l'événement mérite au moins un
  # regard. Conséquence assumée : la plupart des journées n'en comptent aucun,
  # et c'est le résultat correct — il ne se passe pas tous les jours quelque
  # chose sous une région productrice.
  magnitude_seisme_min: 6.0

