      - "gold demand"
      - "gold ETF"
      - "COMEX"
      - "LBMA"
    termes_exacts:
      # « gold » est comparé au mot entier, et non ancré au début d'un mot :
      # mesuré sur une collecte réelle, l'ancrage rangeait « The Goldman Sachs
      # deepens AI push » dans les métaux précieux. Rien n'est perdu — la
      # normalisation coupe les traits d'union et les apostrophes, donc
      # « gold-backed » et « gold's » se retrouvent encore — et « golden
      # cross », qui est une figure de graphique et non le métal, cesse de
      # déclencher.
      - "gold"
      # « or » seul est impossible : deux lettres qui sont la conjonction
      # anglaise la plus courante. Les formes avec article, elles, ne se
      # confondent avec rien.
      - "l'or"
      - "d'or"
      - "de l'or"

