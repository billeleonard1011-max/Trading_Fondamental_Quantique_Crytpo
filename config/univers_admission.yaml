  # --- Événements localisés : c'est ce bloc qui rend USGS exploitable ------
  #
  # Les noms de pays ci-dessous n'admettent RIEN à eux seuls : ils n'entrent en
  # jeu qu'associés à une magnitude sismique au moins égale à
