# Dossiers de conflits suivis par l'onglet Géopolitique (modules/gold/geopolitics.py).
#
# Remplace l'ancienne organisation par thèmes économiques abstraits (tensions
# énergétiques, sanctions...) : l'utilisateur veut suivre des conflits nommés
# et identifiables dans la durée, pas des scores d'intensité déconnectés de
# tout narratif. Voir modules/gold/geopolitics.py::analyser_dossiers.
#
# Structure pensée pour qu'on en ajoute d'autres facilement (Taiwan-Chine...) :
# ajouter une entrée ici suffit, rien à changer dans le code.
#
#   id             identifiant stable, utilisé dans l'historique persistant
#                  (reports/gold/geopolitique_historique.jsonl) et par le
#                  site (onglet par dossier) — ne jamais le renommer une fois
#                  publié, l'historique en dépend.
#   nom_affiche    libellé lisible.
#   acteurs_gdelt  codes CAMEO (base Events de GDELT), pour le signal
#                  d'activité par acteur — voir dataio/gdelt_events.py.
#   type           conflit (bilatéral, défaut), regional (un ensemble de pays,
#                  champ ``pays``) ou thematique (aucun acteur ; canal ci-dessous).
#   canal          chaîne de transmission vers l'or (modules/gold/geopolitics.py
#                  ::CANAUX) : petrole (défaut), taux, risque.
#   epingle        true pour suivre le dossier quoi que mesure le classement
#                  (modules/geopolitique/sujets.py) — le jugement humain garde
#                  la main ; false ou absent : le dossier est classé comme les
#                  sujets découverts, et peut être rétrogradé en veille.
#   mots_cles      termes de la requête GDELT DOC (narratif et intensité de
#                  couverture), combinés en alternative (OR). GDELT indexe
#                  très majoritairement des sources en anglais : les termes
#                  français demandés sont gardés (ils captent la couverture
#                  francophone), complétés par leurs équivalents anglais —
#                  vérifié par appel réel (voir la vérification B1), des
#                  mots-clés uniquement français renvoient un mélange de
#                  langues peu pertinent (arabe, serbe...) faute de terme
#                  assez spécifique pour le filtrage anglais dominant.

dossiers:
  - id: israel_gaza
    nom_affiche: "Israël - Gaza"
    acteurs_gdelt: ["ISR", "PSE"]
    mots_cles: ["Israël", "Israel", "Gaza", "Hamas", "Cisjordanie", "West Bank"]
  - id: iran_etats_unis
    nom_affiche: "Iran - États-Unis"
    acteurs_gdelt: ["IRN", "USA"]
    mots_cles: ["Iran", "détroit d'Ormuz", "strait of Hormuz", "nucléaire iranien", "Iran nuclear"]
  - id: russie_ukraine
    nom_affiche: "Russie - Ukraine"
    acteurs_gdelt: ["RUS", "UKR"]
    mots_cles: ["Russie", "Russia", "Ukraine", "Kremlin", "Zelensky"]

  # --- Dossier régional : ce qui se passe au Moyen-Orient hors des deux
  # dossiers bilatéraux ci-dessus (Houthis-Arabie saoudite, Liban, Irak...).
  # Une attaque qui fait monter le pétrole sans impliquer exactement les
  # acteurs d'un dossier bilatéral se rattache ici, jamais dans « Autres ».
  - id: moyen_orient
    nom_affiche: "Moyen-Orient (région)"
    type: regional
    canal: petrole
    pays: ["ISR", "PSE", "IRN", "IRQ", "SAU", "YEM", "SYR", "LBN", "JOR", "EGY",
           "ARE", "QAT", "KWT", "BHR", "OMN", "TUR"]
    mots_cles: ["Moyen-Orient", "Middle East", "mer Rouge", "Red Sea", "Houthi",
                "Hezbollah", "Golfe persique", "Persian Gulf", "oil facility attack"]

  # --- Dossiers thématiques permanents : ils structurent le contexte plutôt
  # que de produire des événements ponctuels, d'où l'épingle.
  - id: politique_monetaire
    nom_affiche: "Politique monétaire (Fed, BCE)"
    type: thematique
    canal: taux
    epingle: true
    mots_cles: ["Federal Reserve", "FOMC", "Fed rate decision", "Powell", "rate cut",
                "rate hike", "ECB rate", "BCE taux", "Lagarde"]
  - id: semiconducteurs_ia
    nom_affiche: "Semi-conducteurs et IA (contrôles à l'export)"
    type: thematique
    canal: risque
    epingle: true
    mots_cles: ["chip export controls", "semiconductor export", "AI chips China",
                "Nvidia export", "CHIPS Act", "AI regulation", "AI Act"]
  - id: commerce_international
    nom_affiche: "Commerce international (droits de douane)"
    type: thematique
    canal: risque
    epingle: true
    mots_cles: ["tariffs", "trade war", "droits de douane", "trade deal", "import duties",
                "trade restrictions", "WTO dispute"]

  - id: matieres_premieres
    nom_affiche: "Matières premières (précieux, cuivre, pétrole)"
    type: thematique
    # Canal pétrole : la chaîne mesurée est événement → brut → inflation
    # anticipée → taux réels → or (modules/gold/geopolitics.py::CANAUX). C'est
    # bien celle d'un choc d'offre sur une matière première, le pétrole en
    # étant la jambe la plus liquide et la seule que FRED publie au quotidien.
    canal: petrole
    epingle: true
    # Ces mots-clés servent à deux choses, et à deux choses seulement : la
    # requête GDELT DOC qui mesure l'intensité de couverture du dossier, et le
    # rattachement d'un article qui les cite. Ils ne décident PLUS de l'entrée
    # d'un article dans le fil — c'est config/univers_admission.yaml qui s'en
    # charge, sur un vocabulaire bien plus large.
    mots_cles: ["copper price", "copper mine", "copper output", "cours du cuivre",
                "precious metals", "métaux précieux", "gold mining", "gold miner",
                "mine strike", "grève minière", "mining output", "mine closure",
                "commodity prices", "prix des matières premières",
                "rare earths", "terres rares", "lithium supply",
                "OPEC output", "oil production cut"]
    # Dimension géographique du dossier — les régions productrices.
    #
    # Elle ne tient pas dans `mots_cles` : « Chili » y ferait entrer toute
    # l'actualité chilienne, élections comprises. Elle vit donc dans
    # config/univers_admission.yaml, aux domaines regions_precieux,
    # regions_cuivre et regions_petrole, où un nom de pays n'admet un article
    # que s'il porte aussi une magnitude sismique suffisante — et où ces trois
    # domaines renvoient ici par leur champ `dossier`.
    #
    # C'est ce qui rend le flux USGS exploitable : le titre d'un séisme ne
    # nomme qu'un lieu et une magnitude, jamais le cuivre qu'on y extrait.

# Découverte automatique de sujets (modules/geopolitique/sujets.py).
decouverte:
  # Rotation des dossiers (modules/gold/rotation_geopolitique.py).
  #
  # Quatre dossiers sur huit par exécution, soit un cycle de deux exécutions.
  # Un dossier hors du lot republie sa dernière mesure connue, avec son âge,
  # plutôt que de paraître indisponible.
  #
  # Pourquoi quatre, calculé à 21,0 s par requête GDELT mesurées sur
  # l'exécution CI du 11 septembre 2026 :
  #
  #   lot  requêtes  phase géo  job total  cycle      délai max
  #     8        48    16,8 min   25,8 min  1 exéc.   3 jours
  #     6        40    14,0 min   23,0 min  2 exéc.   4 jours
  #     4        32    11,2 min   20,2 min  2 exéc.   4 jours   ← retenu
  #     3        28     9,8 min   18,8 min  3 exéc.   5 jours
  #     2        24     8,4 min   17,4 min  4 exéc.   6 jours
  #
  # Trois ferait gagner 1,4 min de plus, mais porterait le cycle à trois
  # exécutions et le délai maximum à cinq jours : le rapport ne tourne que du
  # lundi au vendredi, et un cycle qui traverse un week-end coûte deux jours.
  # Les durées ci-dessus supposent que TOUTES les mesures échouent et
  # déclenchent leur remesure, soit le pire cas ; si elles aboutissent du
  # premier coup, le lot de quatre tient en 24 requêtes et 17,4 min de job.
  dossiers_par_execution: 4
  heures_events: 24            # exports GDELT Events agrégés (un par quart d'heure)
  max_candidats: 5             # paires d'acteurs retenues dans les exports Events
  max_candidats_mesures: 3     # dont mesurées par GDELT DOC (une requête chacune)
  min_observations: 20         # séances communes couverture × marché pour classer
