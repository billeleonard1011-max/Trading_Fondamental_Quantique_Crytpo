# Rapport quotidien : collecte des données, analyse, publication dans reports/.
#
# HORAIRE : minuit à Paris, tous les jours
#
# GitHub Actions n'exécute les crons qu'en UTC et ne connaît pas l'heure d'été.
# Minuit à Paris vaut donc 22:00 UTC de la veille en été (CEST, UTC+2) et
# 23:00 UTC en hiver (CET, UTC+1). Trois façons de s'en sortir ont été pesées :
#
#   1. une seule entrée cron, en acceptant une heure de dérive la moitié de
#      l'année. Écarté : « minuit » deviendrait « 23 h ou minuit selon la
#      saison », et le rapport basculerait de jour calendaire deux fois par an
#      sans que rien ne le dise ;
#   2. un déclenchement horaire avec un test de l'heure locale. Écarté :
#      vingt-quatre démarrages de job par jour pour en garder un, alors que la
#      date du basculement d'heure est connue à la seconde ;
#   3. DEUX entrées cron, 22:00 et 23:00 UTC, et un job de garde qui ne laisse
#      passer que celle où il est réellement minuit à Paris. Retenu.
#
# Le troisième donne minuit exact toute l'année, sans table de dates à tenir à
# jour : c'est `TZ=Europe/Paris` qui tranche, donc la base de fuseaux du
# système, mise à jour par l'image de l'exécuteur. Le coût est un démarrage de
# job d'une dizaine de secondes par jour, celui qui s'arrête aussitôt.
#
# Le dépôt est public, donc les minutes Actions sont illimitées : passer de
# cinq à sept exécutions par semaine ne coûte rien.
#
# CE QUE CET HORAIRE COÛTE EN FRAÎCHEUR
# Mesuré sur les rapports réellement publiés entre le 8 et le 12 septembre
# 2026, à des heures allant de 09:35 à 00:23 UTC :
#
#   * le cours de l'or du jour J n'apparaît chez la source qu'entre 23:29 et
#     00:23 UTC. À minuit à Paris — 22:00 UTC en été, 23:00 en hiver — il n'est
#     donc pas encore là. Le rapport du jour J porte la clôture de J-2, là où
#     l'horaire de 11:30 UTC portait celle de J-1. La juste valeur et le ratio
#     mines/or, qui en dérivent, reculent d'autant ;
#   * les séries FRED du jour J paraissent entre 16:12 et 21:15 UTC le jour
#     même : elles sont donc disponibles à minuit à Paris, comme elles
#     l'étaient à 11:30 UTC. Aucune perte ;
#   * le rapport COT du vendredi paraît vers 19:40 UTC. Minuit à Paris le
#     samedi le capte, alors que l'ancien horaire attendait le lundi. Gain de
#     deux jours.
#
# Reculer d'une heure — 01:00 à Paris au lieu de minuit — récupérerait la
# clôture de l'or. C'est un arbitrage à trancher, pas un défaut.
#
# GitHub met par ailleurs les crons en file d'attente aux heures chargées :
# un retard de quelques minutes à une heure est courant et n'indique rien
# d'anormal. Ne planifiez rien qui dépende de la minute exacte.

name: Rapport quotidien

on:
  schedule:
    # Les deux entrées visent le même instant : minuit à Paris. Le job de
    # garde `minuit` arrête celle qui tombe à côté selon la saison.
    - cron: "0 22 * * *"      # minuit à Paris en heure d'été (CEST, UTC+2)
    - cron: "0 23 * * *"      # minuit à Paris en heure d'hiver (CET, UTC+1)
  workflow_dispatch:           # déclenchement manuel depuis l'onglet Actions

# Nécessaire pour que l'étape de commit puisse pousser dans le dépôt.
permissions:
  contents: write

# Une seule exécution à la fois : deux rapports simultanés se marcheraient
# dessus au moment du commit.
concurrency:
  group: rapport-quotidien
  cancel-in-progress: false

jobs:
  # Garde d'horaire : des deux entrées cron, une seule tombe à minuit à Paris.
  # L'autre s'arrête ici, en une dizaine de secondes, sans démarrer la collecte.
  minuit:
    name: Est-il minuit à Paris ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      executer: ${{ steps.heure.outputs.executer }}
    steps:
      - id: heure
        run: |
          # TZ=Europe/Paris délègue le calcul à la base de fuseaux du système,
          # qui connaît les dates de bascule. Rien à tenir à jour ici.
          heure_paris=$(TZ=Europe/Paris date +%-H)
          horodatage=$(TZ=Europe/Paris date '+%Y-%m-%d %H:%M %Z')
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "executer=true" >> "$GITHUB_OUTPUT"
            echo "Déclenchement ${GITHUB_EVENT_NAME} : exécution sans condition d'heure (${horodatage})."
          elif [ "${heure_paris}" -eq 0 ]; then
            echo "executer=true" >> "$GITHUB_OUTPUT"
            echo "Minuit à Paris (${horodatage}) : le rapport est produit."
          else
            echo "executer=false" >> "$GITHUB_OUTPUT"
            echo "Il est ${heure_paris} h à Paris (${horodatage}) : c'est l'autre entrée cron qui produira le rapport aujourd'hui."
          fi

  rapport:
    name: Générer et publier le rapport
    needs: minuit
    if: needs.minuit.outputs.executer == 'true'
    runs-on: ubuntu-latest
    # 45 plutôt que 30 : les réessais GDELT (jusqu'à ~105 s par requête
    # refusée, plus 20 puis 40 s par dossier remesuré) peuvent allonger
    # l'exécution ; un rapport complet vaut ces minutes.
    timeout-minutes: 45

    env:
      # Les clés proviennent des secrets du dépôt. Elles n'apparaissent
      # jamais dans les journaux : GitHub les masque automatiquement.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      # Couche pédagogique du moteur or. Facultative : sans elle, les
      # explications basculent sur les gabarits et le rapport reste complet.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Jeton applicatif Socrata, facultatif : il ne relève que la limite de
      # débit de l'API CFTC, dont l'accès reste public sans lui.
      CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
      # Exigée par la SEC : tout appel à EDGAR doit porter un User-Agent
      # identifiant l'appelant avec une adresse jointe. Sans elle, les
      # requêtes reçoivent un 403 — vérifié.
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          # Historique complet : l'étape de publication rejoue son commit
          # par-dessus le dépôt distant, ce qu'un clone superficiel interdit.
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests
        # Aucun test n'accède au réseau : ils sont déterministes et durent
        # moins d'une seconde. Un échec ici doit empêcher la publication.
        run: python -m pytest tests/ -q

      - name: Installer Node.js pour les tests du site
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Exécuter les tests du site public
        # Ces tests protègent deux invariants : aucune donnée de compte ne
        # s'affiche, et un rapport absent ou malformé n'emporte pas le reste
        # de la page. Un échec ici doit empêcher la publication d'un site
        # cassé ou d'une fuite de champ privé.
        run: node --test site/tests/site.test.js

      - name: Exécuter les tests du Worker (proxy assistant)
        # Le Worker n'est pas déployé depuis ce dépôt — Cloudflare exige une
        # authentification interactive que l'automatisation ne peut pas
        # fournir. Ce test vérifie la logique (limitation de débit, absence
        # de fuite de clé, gestion des erreurs) avec un KV et un fetch
        # OpenAI simulés, sans compte ni réseau.
        run: node --test worker/tests/worker.test.js

      - name: Vérifier la causalité des indicateurs
        # Garde-fou : si un indicateur se met à regarder le futur, le rapport
        # ne doit pas être publié. Une erreur silencieuse ici invaliderait
        # tout signal produit ensuite.
        run: python -m core.indicators

      - name: Générer le rapport or
        # Le moteur est conçu pour aboutir même quand une source est muette :
        # le bloc concerné est marqué indisponible avec son motif, et le biais
        # signale qu'il repose sur des données partielles. Un code de sortie
        # non nul signale donc un vrai défaut, pas une source absente.
        run: |
          mkdir -p reports/gold
          python -m modules.gold.run

      - name: Résumer le rapport dans le journal d'exécution
        # Permet de lire l'essentiel depuis l'onglet Actions, sans ouvrir le
        # JSON ni cloner le dépôt.
        if: always()
        run: |
          if [ -f reports/gold/latest.json ]; then
            python - <<'PY'
          import json, pathlib
          rapport = json.loads(pathlib.Path("reports/gold/latest.json").read_text(encoding="utf-8"))
          meta, biais = rapport["meta"], rapport["biais"]
          print(f"Date            : {meta['date']}")
          print(f"Biais           : {biais['biais']} (score {biais['score_composite']:+.3f}, conviction {biais['conviction']})")
          print(f"Couverture      : {biais['couverture_donnees']:.0%}")
          if meta["sources_en_echec"]:
              print(f"Sources muettes : {', '.join(meta['sources_en_echec'])}")
          for composante in biais["composantes"]:
              etat = f"{composante['contribution']:+.4f}" if composante["disponible"] else "indisponible"
              print(f"  {composante['nom']:26s} {etat}")
          PY
          else
            echo "Aucun rapport produit."
          fi

      - name: Veille sur les valeurs quantiques
        # Une panne de la veille quantique ne doit pas empêcher la
        # publication du rapport or, qui porte l'instrument réellement
        # tradé — mais elle ne doit pas non plus passer inaperçue :
        # « continue-on-error » affichait l'étape en vert, et le site a
        # servi pendant deux jours un rapport périmé sans que rien ne le
        # dise. L'échec est désormais une annotation d'avertissement, visible
        # dans le résumé de l'exécution.
        run: |
          mkdir -p reports/quantum
          python -m modules.quantum.run \
            || echo "::warning title=Veille quantique::échec, le rapport précédent reste publié (voir le journal de l'étape)"

      - name: Veille sur les positions crypto
        run: |
          mkdir -p reports/crypto
          python -m modules.crypto.run \
            || echo "::warning title=Veille crypto::échec, le rapport précédent reste publié (voir le journal de l'étape)"

      - name: Vérifier la fraîcheur des rapports
        # Un rapport qui n'a pas été réécrit aujourd'hui est signalé ici,
        # quelle que soit la raison : c'est la vérification que le site
        # affichera bien des données du jour.
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          aujourd_hui = datetime.date.today().isoformat()
          for nom in ("gold", "quantum", "crypto"):
              chemin = pathlib.Path(f"reports/{nom}/latest.json")
              if not chemin.exists():
                  print(f"::warning title=Rapport {nom}::aucun fichier latest.json")
                  continue
              date = json.loads(chemin.read_text(encoding="utf-8")).get("meta", {}).get("date")
              if date != aujourd_hui:
                  print(f"::warning title=Rapport {nom} périmé::daté du {date}, exécution du {aujourd_hui}")
              else:
                  print(f"Rapport {nom} : {date}")
          PY

      # Les trois fils d'actualité (quantique, crypto, géopolitique) tournent
      # dans un workflow séparé (.github/workflows/fils_actualite.yml) : ils
      # dépendent de GDELT, dont le débit limité sans préavis a mesuré
      # ~10 minutes à lui seul, ce qui aurait fait dépendre la publication du
      # rapport or — l'instrument réellement tradé — de la disponibilité
      # d'une API externe hors de notre contrôle.

      - name: Publier le rapport dans le dépôt
        # Le dépôt bouge pendant l'exécution : le workflow des fils tourne
        # toutes les quinze à trente minutes, et une modification manuelle
        # peut arriver à tout moment. La publication ne doit donc dépendre
        # d'aucune chance de synchronisation.
        #
        # L'ancienne version faisait « commit puis pull --rebase » : un
        # rebasage qui rencontre un conflit s'arrête et fait échouer le
        # workflow — c'est exactement ce qui s'est produit en production.
        # Le correctif supprime la possibilité même du conflit plutôt que
        # d'essayer de le résoudre : on replace HEAD sur l'état publié le
        # plus récent (« reset --mixed »), l'arbre de travail garde les
        # sorties fraîchement générées, et seules les sorties sont
        # réindexées. Aucune fusion n'a lieu, donc aucun conflit possible.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publier() {
            git fetch --quiet origin "${GITHUB_REF_NAME}"

            # HEAD repart de l'état publié ; l'index le suit, l'arbre de
            # travail (qui porte les sorties de cette exécution) est conservé.
            # Les fichiers modifiés en amont que ce workflow ne produit pas
            # restent ceux de l'amont : on ne les réindexe jamais.
            git reset --quiet --mixed "origin/${GITHUB_REF_NAME}"

            # Les journaux en ajout seul s'accumulent au lieu d'être
            # recalculés : les écraser perdrait les lignes ajoutées par
            # l'exécution concurrente. Ils sont donc fusionnés par union
            # avant d'être réindexés (voir scripts/fusionner_sorties.py).
            python -m scripts.fusionner_sorties "origin/${GITHUB_REF_NAME}"

            git add reports/
            # Le cache du calendrier FOMC est régénéré à chaque collecte
            # réussie. Le versionner ici entretient le filet de sécurité :
            # sans ce commit, la copie du dépôt resterait figée au jour où
            # elle a été créée et vieillirait jusqu'à déclencher l'alerte de
            # renouvellement, alors même que la collecte fonctionne.
            git add config/fomc_calendar_cache.json
            # Les historiques accumulés par les modules crypto (dominance
            # BTC, actifs nets des ETF) vivent sous reports/crypto/ : ils
            # sont indexés avec reports/ et fusionnés par union ci-dessus.

            if git diff --staged --quiet; then
              echo "Aucune sortie nouvelle : rien à publier."
              return 0
            fi

            git commit --quiet -m "Rapport automatique du $(date -u '+%Y-%m-%d')"
            git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
          }

          # Un autre push peut encore survenir entre le fetch et le push :
          # la fenêtre est étroite mais réelle. On réessaie, chaque tentative
          # repartant du dernier état publié — l'opération est idempotente,
          # le commit précédent étant défait par le reset de la suivante.
          for tentative in 1 2 3; do
            if publier; then
              echo "Publication réussie (tentative ${tentative})."
              exit 0
            fi
            echo "Publication refusée (tentative ${tentative}/3) : nouvelle tentative dans 10 s."
            sleep 10
          done

          echo "::error::Publication impossible après 3 tentatives."
          exit 1

      - name: Archiver le rapport en artefact
        # Doublon volontaire du commit : l'artefact reste consultable même si
        # la publication dans le dépôt échoue.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
