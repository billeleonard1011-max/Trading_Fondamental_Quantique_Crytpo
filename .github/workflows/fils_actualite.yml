# Fils d'actualité (quantique, crypto, géopolitique) : séparés du rapport
# quotidien de l'or.
#
# Pourquoi un workflow distinct
# ------------------------------
# Les trois fils dépendent de GDELT, qui limite le débit sans le publier :
# chaque requête au-delà de la première déclenche des 429 et une attente
# exponentielle. Sur trois fils (dix jetons crypto, une dizaine de valeurs
# quantiques, quatre thèmes géopolitiques), c'est près de vingt requêtes
# GDELT séquentielles par exécution, ce qui a mesuré ~10 minutes à lui seul
# lors de l'ajout des fils crypto et géopolitique — largement plus que la
# variance habituelle du reste du pipeline (~1 minute). Les garder dans le
# même job que le rapport or aurait fait dépendre la publication d'un
# chiffre réellement tradé (l'or) de la disponibilité d'une API externe que
# rien ici ne contrôle. Ce workflow tourne donc à part : une lenteur ou un
# échec GDELT ne retarde plus jamais reports/gold/latest.json.
#
# Les trois fils restent dans le même job (donc la même exécution) pour
# préserver la mutualisation du cache GDELT de dataio.news : une requête
# identique à celle déjà posée par un autre fil dans les 30 dernières
# minutes est servie depuis le cache plutôt que reposée.
#
# Cadence : toutes les trente minutes, avec GDELT une fois sur quatre
# -------------------------------------------------------------------
# Les flux RSS n'ont ni limite de débit ni coût : ce sont eux qui portent la
# fraîcheur, et depuis la correction du filtre de pertinence, l'essentiel du
# fil géopolitique. GDELT est l'inverse — lent (son limiteur impose huit
# secondes entre deux appels), limité en débit, et il nous renvoie déjà des
# 429 à dix-neuf appels par exécution.
#
# Les deux sont donc découplés dans une seule et même exécution :
#   * chaque exécution collecte les flux RSS — une à deux minutes ;
#   * une exécution sur quatre (heures paires, première demi-heure)
#     interroge aussi GDELT — huit à dix minutes.
#
# Un seul workflow plutôt que deux : le groupe de concurrence garantit alors
# qu'aucune exécution n'en double une autre, ce qui évite à la fois les
# écritures concurrentes sur les mêmes fichiers et la course sur le compteur
# d'analyses quotidiennes (modules/quota_llm.py).
#
# Volume GDELT résultant : onze appels toutes les deux heures, soit environ
# cent trente par jour — contre neuf cent douze si chacune des quarante-huit
# exécutions l'interrogeait.

name: Fils d'actualité

on:
  schedule:
    # Toutes les trente minutes, tous les jours : les cryptos cotent le
    # week-end et l'actualité ne s'arrête pas. Le dépôt étant public, les
    # minutes GitHub Actions sont gratuites et illimitées.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Un fil à la fois, mais indépendant du rapport quotidien : les deux
# workflows peuvent tourner en parallèle sans se marcher dessus, puisqu'ils
# publient chacun dans des fichiers disjoints (reports/{quantum,crypto,geopolitique}/feed_*).
concurrency:
  group: fils-actualite
  cancel-in-progress: false

jobs:
  fils:
    name: Collecter et publier les trois fils
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Couche pédagogique des trois fils. Facultative : sans elle, les
      # explications basculent sur les gabarits déterministes et les fils
      # restent complets.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Décider si GDELT est interrogé à cette exécution
        # GDELT une fois sur quatre : heures paires, première demi-heure.
        # GitHub met les crons en file d'attente et les déclenche parfois
        # avec plusieurs minutes de retard ; le test sur la demi-heure
        # absorbe ce décalage. Un retard de plus de trente minutes fait
        # simplement sauter un passage GDELT — sans conséquence, le suivant
        # aura lieu deux heures plus tard.
        id: cadence
        run: |
          heure=$(date -u +%-H)
          minute=$(date -u +%-M)
          if [ $((heure % 2)) -eq 0 ] && [ "$minute" -lt 30 ]; then
            echo "options=" >> "$GITHUB_OUTPUT"
            echo "Cette exécution interroge GDELT."
          else
            echo "options=--sans-gdelt" >> "$GITHUB_OUTPUT"
            echo "Cette exécution ne collecte que les flux RSS."
          fi

      - name: Fil d'actualité quantique
        continue-on-error: true
        run: |
          mkdir -p reports/quantum
          python -m modules.quantum.feed ${{ steps.cadence.outputs.options }}

      - name: Fil d'actualité crypto
        continue-on-error: true
        run: |
          mkdir -p reports/crypto
          python -m modules.crypto.feed ${{ steps.cadence.outputs.options }}

      - name: Fil d'actualité géopolitique
        # Relit reports/gold/latest.json (publié par le workflow "Rapport
        # quotidien") pour réutiliser l'intensité par thème déjà calculée
        # plutôt que la recalculer. Si ce rapport n'existe pas encore ou est
        # d'une exécution antérieure, le fil reste fonctionnel : la mesure
        # d'intensité manque simplement pour les nouveaux items.
        continue-on-error: true
        run: |
          mkdir -p reports/geopolitique
          python -m modules.geopolitique.feed ${{ steps.cadence.outputs.options }}

      - name: Publier les fils dans le dépôt
        # Même mécanique que la publication du rapport or, et pour la même
        # raison : ce workflow tourne toutes les quinze à trente minutes et
        # croise régulièrement le rapport quotidien. Un « commit puis
        # pull --rebase » s'arrête au premier conflit ; ici on replace HEAD
        # sur l'état publié, on fusionne les journaux en ajout seul, et on
        # réindexe les sorties — aucune fusion de contenu par git, donc
        # aucun conflit possible. Voir .github/workflows/daily.yml.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publier() {
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --mixed "origin/${GITHUB_REF_NAME}"

            # Les historiques de fil accumulent : les écraser ferait perdre
            # la trace « déjà vu » des articles ajoutés par l'exécution
            # concurrente, qui resurgiraient en nouveauté plus tard. Les fils
            # publiés se fusionnent aussi, par union : une exécution sans
            # GDELT n'a qu'une vue partielle et ne doit pas amputer le fil.
            python -m scripts.fusionner_sorties "origin/${GITHUB_REF_NAME}"

            # Un par un, et seulement s'il existe.
            #
            # « git add a b c » abandonne TOUT dès qu'un chemin manque : il
            # sort en « fatal: pathspec did not match any files » sans rien
            # indexer. Avec « 2>/dev/null || true », l'échec ne se voyait pas,
            # et l'étape suivante concluait « Aucun item nouveau » puis
            # annonçait une publication réussie.
            #
            # Le chemin qui manquait : reports/quota_llm.json n'est écrit que
            # si une analyse a réellement été facturée. Une exécution qui se
            # replie sur le gabarit déterministe ne le crée pas — et perdait
            # alors les trois fils qu'elle venait de construire. Mesuré : le
            # fil géopolitique du 11 septembre 17:49 avait bien produit
            # 40 items, jetés à cette ligne.
            for fichier in reports/quantum/feed_latest.json reports/quantum/feed_historique.jsonl \
                           reports/crypto/feed_latest.json reports/crypto/feed_historique.jsonl \
                           reports/geopolitique/feed_latest.json reports/geopolitique/feed_historique.jsonl \
                           reports/quota_llm.json; do
              if [ -f "${fichier}" ]; then
                git add "${fichier}"
              fi
            done

            if git diff --staged --quiet; then
              # Cas normal quand rien n'a bougé depuis la dernière exécution,
              # toutes les trente minutes. Mais c'est aussi ce qu'affichait le
              # workflow quand l'indexation échouait en silence : une
              # annotation rend le cas visible dans l'onglet Actions au lieu
              # de se lire comme un succès ordinaire.
              echo "::warning::Aucun item nouveau : rien n'a été publié. Normal si les fils n'ont rien de neuf ; à examiner si les journaux ci-dessus annoncent des items."
              return 0
            fi

            git commit --quiet -m "Fils d'actualité du $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
          }

          for tentative in 1 2 3; do
            if publier; then
              echo "Publication réussie (tentative ${tentative})."
              exit 0
            fi
            echo "Publication refusée (tentative ${tentative}/3) : nouvelle tentative dans 10 s."
            sleep 10
          done

          echo "::error::Publication impossible après 3 tentatives."
          exit 1

      - name: Archiver les fils en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fils-actualite-${{ github.run_number }}
          path: |
            reports/quantum/feed_latest.json
            reports/crypto/feed_latest.json
            reports/geopolitique/feed_latest.json
          retention-days: 30
          if-no-files-found: warn
